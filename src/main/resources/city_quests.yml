# ===================================================================
# VanillaEconomy - Quêtes de cité (extension "Quêtes de cité")
#
# Chaque cité qui possède l'extension a UNE quête à la fois : une
# collecte d'items rares. Les membres déposent les items (/city quest
# deposit ou le livre de l'extension dans /cityboard) ; les items déposés sont
# définitivement consommés. Objectif atteint avant l'échéance : la
# récompense est versée sur le solde de la cité.
#
# Ce fichier se modifie sans toucher au code, puis :
#   /cityadmin quests reload   (permission cities.admin.quests)
# Une entrée invalide est ignorée avec un avertissement dans la console,
# les autres sont chargées. Les quêtes déjà tirées gardent leurs valeurs :
# une modification ne s'applique qu'aux tirages suivants.
# Options générales (répétition, rappel, historique...) : cities.yml,
# section quests.
# ===================================================================

# -------------------------------------------------------------------
# Difficultés
#   name           : nom affiché (français)
#   color          : couleur dans l'interface et le chat (BLACK, DARK_BLUE,
#                    DARK_GREEN, DARK_AQUA, DARK_RED, DARK_PURPLE, GOLD, GRAY,
#                    DARK_GRAY, BLUE, GREEN, AQUA, RED, LIGHT_PURPLE, YELLOW,
#                    WHITE ; inconnue = WHITE)
#   weight         : poids au tirage (0 = jamais tirée). Une difficulté est
#                    d'abord tirée selon ce poids, puis une de ses quêtes.
#   default_reward : récompense (pièces) des quêtes qui n'en précisent pas
#   duration_hours : durée des quêtes qui n'en précisent pas
# Pour ajouter une difficulté : copier un bloc et changer sa clé.
# -------------------------------------------------------------------
difficulties:
  EASY:   { name: "Facile",    color: GREEN,        weight: 40, default_reward: 400,  duration_hours: 24 }
  MEDIUM: { name: "Moyenne",   color: YELLOW,       weight: 30, default_reward: 800,  duration_hours: 36 }
  HARD:   { name: "Difficile", color: RED,          weight: 20, default_reward: 1500, duration_hours: 48 }
  EPIC:   { name: "Épique",    color: LIGHT_PURPLE, weight: 10, default_reward: 3000, duration_hours: 48 }

# -------------------------------------------------------------------
# Quêtes (la clé est l'identifiant unique de la quête)
#   name           : nom affiché
#   difficulty     : clé d'une difficulté ci-dessus
#   amount         : quantité à rassembler (> 0)
#   item demandé, sous UNE des trois formes :
#     material: X           un seul item (nom de Material Minecraft)
#     materials: [X, Y]     n'importe lequel compte, additionnés
#     tag: "minecraft:..."  tag d'items Minecraft (n'importe quel item du tag)
#   Optionnels :
#     enabled        : false pour désactiver la quête (sa progression est
#                      conservée et reprend si elle est réactivée)
#     reward         : récompense, sinon default_reward de la difficulté
#     duration_hours : durée, sinon celle de la difficulté
#     weight         : poids dans sa difficulté (défaut 1, 0 = jamais tirée)
#     hint           : texte affiché pour les quêtes multi-items
# Refusés : l'item de la pièce du plugin, et les items du marché des idiots
# (items.yml), sauf avec quests.allow-market-items: true dans cities.yml.
# Pour supprimer une quête : retirer son entrée ou mettre enabled: false.
#
# Exemple prêt à copier :
#   ma_quete:
#     name: "Plumes de poulet"
#     difficulty: EASY
#     material: FEATHER
#     amount: 64
#     reward: 300
#     duration_hours: 12
#     weight: 1
# -------------------------------------------------------------------
