name: VanillaEconomy
version: '1.0.0'
main: fr.vanillaeconomy.VanillaEconomyPlugin
api-version: '26.3'
description: Monnaie virtuelle + marché global tenu par les idiots du village. 100% vanilla côté client.
libraries:
  - org.xerial:sqlite-jdbc:3.53.4.0

commands:
  money:
    description: Convertir son solde en pièces physiques et inversement.
    usage: "/money <drop <montant>|deposit>"
    permission: vanillaeconomy.money
  solde:
    description: Afficher son solde.
    usage: "/solde"
    aliases: [balance, bal]
    permission: vanillaeconomy.solde
  pay:
    description: Transférer de l'argent à un joueur proche (10 blocs max, même monde).
    usage: "/pay <joueur> <montant>"
    permission: vanillaeconomy.pay
  marketadmin:
    description: Administration du marché.
    usage: "/marketadmin <rotate [promo [%]]|promos|discordtest|info <item>|setstock <item> <quantité>>"
    permission: vanillaeconomy.admin
  eco:
    description: "Administration des soldes : donner, retirer ou fixer des pièces."
    usage: "/eco give|take|set <joueur> <montant>"
    permission: vanillaeconomy.admin
  city:
    description: Fonder et gérer une cité.
    usage: "/city help"
    aliases: [cite, ville]
    permission: cities.use
  cityboard:
    description: Tableau de bord d'une cité (membres).
    usage: "/cityboard <cité>"
    permission: cities.use
  border:
    description: Afficher les bordures d'une cité.
    usage: "/border <cité> on|off"
    permission: cities.use
  cityadmin:
    description: Administration des cités.
    usage: "/cityadmin delete|settier|rename|info"
    permission: cities.admin

permissions:
  vanillaeconomy.money:
    default: true
  vanillaeconomy.solde:
    default: true
  vanillaeconomy.pay:
    default: true
  vanillaeconomy.market:
    description: Utiliser les idiots marchands.
    default: true
  vanillaeconomy.admin:
    default: op
  vanillaeconomy.notify:
    description: Recevoir les alertes anti-dupe.
    default: op
  cities.use:
    description: Commandes des cités.
    default: true
  cities.admin:
    description: Supprimer / modifier n'importe quelle cité.
    default: op
  cities.admin.bypass:
    description: Ignorer la protection des territoires.
    default: op
