# ===================================================================
# VanillaEconomy - Cités
# Les textes affichés aux joueurs sont dans messages.yml (section cities).
# ===================================================================

# Coût de création, prélevé sur le solde personnel du fondateur.
creation_cost: 2500

# Mondes où une cité peut être créée (noms des dossiers de monde).
allowed_worlds:
  - world

# Nombre minimal de blocs libres entre deux cités (paliers compris).
min_gap_blocks: 16

name:
  min_length: 3
  max_length: 16
  # Caractères autorisés : lettres sans accent, chiffres, - et _

# Paliers d'agrandissement : taille du carré (en blocs) et prix payé avec
# le SOLDE DE LA CITÉ. Le palier 1 est la création (son prix est ignoré,
# voir creation_cost). Agrandissement symétrique autour du centre d'origine.
tiers:
  1: { size: 32,  price: 2500 }
  2: { size: 64,  price: 5000 }
  3: { size: 128,  price: 20000 }
  4: { size: 256,  price: 50000 }
  5: { size: 512, price: 100000 }

# Extensions achetées une fois avec le SOLDE DE LA CITÉ, par le
# propriétaire (/cityboard, onglet Extensions).
extensions:
  teleport:
    # Débloque /city tp <cité> pour les membres : téléportation au centre
    # de la cité (hauteur de fondation, ou premier espace libre au-dessus).
    # false = extension désactivée : ni achetable ni utilisable, y compris
    # par les cités qui l'ont déjà achetée (elles la retrouvent si elle est
    # réactivée).
    enabled: true
    # Palier que la cité doit avoir atteint pour pouvoir l'acheter.
    min_tier: 2
    price: 10000
    # Payé par le joueur à chaque téléportation (solde personnel). Ces
    # pièces sont détruites : elles sortent de l'économie.
    use_cost: 100
  promo_frenzy:
    # « Promotion en folie » : les idiots marchands qui se trouvent dans la
    # cité font promos_per_day promotions de plus par jour, tirées parmi les
    # rotations sans promo globale (6 promos sur 12 rotations avec 2 + 4).
    enabled: true
    min_tier: 3
    price: 10000
    # Conditions d'achat : au moins un idiot marchand (adulte, vivant) de
    # chacun de ces types dans les limites de la cité. Clés du registre
    # Minecraft des types de villageois (skins).
    required_villager_types: [desert, jungle, plains, savanna, snow, swamp, taiga]
    promos_per_day: 4
    min_percent: 5
    max_percent: 50
    # Messages dans le chat aux membres en ligne de la cité (aucune annonce
    # Discord : seules les promos globales y sont annoncées).
    announcements:
      warning: true
      warning_minutes_before: 120
      start: true
      join_reminder: true

# Classement des cités (/classement on|off, à droite de l'écran) : palier,
# puis nombre d'extensions, puis solde de la cité.
ranking:
  # Nombre de cités affichées (15 au maximum).
  size: 10

protection:
  # Empêcher les non-membres de blesser animaux et villageois dans une cité.
  protect_animals: true
  # Message court en actionbar quand un visiteur tente une action refusée.
  actionbar_message: true
  # Blocs que les visiteurs peuvent ouvrir / fermer. "#tag" = tag de blocs
  # Minecraft, sinon un id de Material. Les coffres de l'Ender (stockage
  # personnel) sont toujours autorisés. Les portillons sont exclus par
  # défaut (ajouter "#fence_gates" pour les autoriser).
  visitor_interactions:
    - "#doors"
    - "#trapdoors"

presence:
  # Messages dans le chat à l'entrée / sortie d'une cité.
  messages: true
  # Message d'entrée à la connexion si le joueur se trouve dans une cité.
  message_on_join: true

border:
  # Rayon horizontal (blocs) autour du joueur où la bordure est dessinée.
  # Il s'agrandit automatiquement jusqu'au bord le plus proche (160 blocs
  # max), pour que les murs d'une grande cité restent visibles de son centre.
  radius: 24
  # Hauteur dessinée au-dessus et au-dessous du joueur.
  height: 8
  # Rafraîchissement des particules (ticks, 20 = 1 seconde).
  refresh_ticks: 10

# Délai (secondes) pour confirmer /city disband et /city upgrade.
confirm_seconds: 30
