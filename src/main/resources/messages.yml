# ===================================================================
# VanillaEconomy - textes affichés aux joueurs
# Format MiniMessage (https://docs.advntr.dev/minimessage/format.html).
# Les variables entre accolades ({city}, {player}...) sont remplacées.
# Une clé supprimée reprend sa valeur par défaut.
# ===================================================================

cities:
  prefix: "<dark_gray>[<aqua>Cité</aqua>]</dark_gray> "

  # --- entrée / sortie ---------------------------------------------
  enter: "<gray>Vous entrez dans la cité <aqua>{city}</aqua> (propriétaire : <white>{owner}</white>)"
  exit: "<gray>Vous quittez la cité <aqua>{city}</aqua>"

  # --- protection (actionbar) ---------------------------------------
  denied: "<red>Cette parcelle appartient à la cité <aqua>{city}</aqua>"

  # --- commandes générales -------------------------------------------
  players_only: "<red>Commande réservée aux joueurs."
  unknown_city: "<red>Aucune cité nommée <white>{city}</white>."
  unknown_player: "<red>Joueur inconnu : <white>{player}</white> (il doit s'être connecté au moins une fois)."
  not_member: "<red>Vous n'êtes pas membre de la cité <aqua>{city}</aqua>."
  no_permission_role: "<red>Votre rôle dans la cité <aqua>{city}</aqua> ne permet pas cette action."
  insufficient_funds: "<red>Solde insuffisant : il faut <gold>{amount}</gold>."
  invalid_amount: "<red>Le montant doit être un entier strictement positif."
  internal_error: "<red>Erreur interne, aucune modification n'a été faite."
  confirm_expired: "<red>Aucune action à confirmer (ou délai dépassé)."
  usage: |-
    <gold>Commandes des cités :</gold>
    <yellow>/city create <nom></yellow> <gray>- fonder une cité ({cost})</gray>
    <yellow>/city info [nom]</yellow> <gray>- informations sur une cité</gray>
    <yellow>/city add <joueur> [cité]</yellow> <gray>- ajouter un membre</gray>
    <yellow>/city kick <joueur> [cité]</yellow> <gray>- exclure un membre</gray>
    <yellow>/city coowner set|unset <joueur></yellow> <gray>- gérer les co-propriétaires</gray>
    <yellow>/city contribute <nom> <montant></yellow> <gray>- verser au solde de la cité</gray>
    <yellow>/city upgrade</yellow> <gray>- acheter le palier suivant</gray>
    <yellow>/city leave <nom></yellow> <gray>- quitter une cité</gray>
    <yellow>/city disband</yellow> <gray>- dissoudre votre cité</gray>
    <yellow>/city rename <nom> <nouveau nom></yellow> <gray>- renommer votre cité</gray>
    <yellow>/city tp <nom></yellow> <gray>- se téléporter au centre de sa cité (extension)</gray>
    <yellow>/cityboard <nom></yellow> <gray>- tableau de bord (membres)</gray>
    <yellow>/border <nom> on|off</yellow> <gray>- afficher les bordures</gray>
    <yellow>/classement on|off</yellow> <gray>- classement des cités à l'écran</gray>

  # --- création ------------------------------------------------------
  create_world_denied: "<red>Les cités ne peuvent pas être fondées dans ce monde."
  create_already_owner: "<red>Vous possédez déjà la cité <aqua>{city}</aqua> : un joueur ne peut posséder qu'une cité."
  create_invalid_name: "<red>Nom invalide : {min} à {max} caractères, lettres sans accent, chiffres, - et _."
  create_name_taken: "<red>Le nom <white>{city}</white> est déjà pris."
  create_conflict: "<red>Trop près de la cité <aqua>{city}</aqua> (au moins {gap} blocs d'écart sont requis)."
  created: "<green>La cité <aqua>{city}</aqua> est fondée ! <gray>Territoire {size}x{size} centré sur vous, <gold>{cost}</gold> débitées."

  # --- membres -------------------------------------------------------
  ambiguous_city: "<red>Vous gérez plusieurs cités : précisez laquelle (dernier argument)."
  no_managed_city: "<red>Vous ne gérez aucune cité."
  add_already_member: "<red><white>{player}</white> est déjà membre de <aqua>{city}</aqua>."
  added: "<green><white>{player}</white> a été ajouté à la cité <aqua>{city}</aqua>."
  added_notify: "<green>Vous avez été ajouté à la cité <aqua>{city}</aqua> par <white>{actor}</white>."
  kick_not_member: "<red><white>{player}</white> n'est pas membre de <aqua>{city}</aqua>."
  kicked: "<yellow><white>{player}</white> a été exclu de la cité <aqua>{city}</aqua>."
  kicked_notify: "<red>Vous avez été exclu de la cité <aqua>{city}</aqua>."
  leave_owner: "<red>Le propriétaire ne peut pas quitter sa cité : utilisez /city disband."
  left: "<yellow>Vous avez quitté la cité <aqua>{city}</aqua>."
  coowner_set: "<green><white>{player}</white> est maintenant co-propriétaire de <aqua>{city}</aqua>."
  coowner_unset: "<yellow><white>{player}</white> n'est plus co-propriétaire de <aqua>{city}</aqua>."
  coowner_notify_set: "<green>Vous êtes maintenant co-propriétaire de la cité <aqua>{city}</aqua>."
  coowner_notify_unset: "<yellow>Vous n'êtes plus co-propriétaire de la cité <aqua>{city}</aqua>."

  # --- trésorerie ----------------------------------------------------
  contributed: "<green>Vous avez versé <gold>{amount}</gold> à la cité <aqua>{city}</aqua>. Solde de la cité : <gold>{balance}</gold>."

  # --- paliers -------------------------------------------------------
  upgrade_max: "<red>La cité <aqua>{city}</aqua> a déjà atteint le palier maximum."
  upgrade_funds: "<red>Solde de la cité insuffisant : <gold>{price}</gold> requises, <gold>{balance}</gold> disponibles."
  upgrade_conflict: "<red>Agrandissement impossible : le territoire toucherait la cité <aqua>{other}</aqua>."
  upgrade_confirm: "<yellow>Acheter le palier {tier} ({size}x{size}) pour <gold>{price}</gold> du solde de la cité ? Tapez <white>/city upgrade confirm</white> dans les {seconds} s."
  upgraded: "<green>La cité <aqua>{city}</aqua> passe au palier {tier} : territoire {size}x{size} !"

  # --- renommage ------------------------------------------------------
  rename_usage: "<red>Usage : /city rename <cité> <nouveau nom>"
  renamed: "<green>La cité <aqua>{old}</aqua> s'appelle désormais <aqua>{city}</aqua>."
  renamed_notify: "<yellow>La cité <aqua>{old}</aqua> a été renommée <aqua>{city}</aqua> par son propriétaire."

  # --- extensions -----------------------------------------------------
  extension_owned: "<red>La cité <aqua>{city}</aqua> possède déjà l'extension {extension}."
  extension_tier: "<red>L'extension {extension} se débloque au palier {tier} : la cité <aqua>{city}</aqua> est au palier {current}."
  extension_disabled: "<red>L'extension {extension} est désactivée sur ce serveur."
  extension_bought_teleport: "<green>Extension <white>{extension}</white> achetée pour la cité <aqua>{city}</aqua> (<gold>{price}</gold> du solde de la cité). <gray>Les membres peuvent utiliser <white>/city tp {city}</white> (<gold>{cost}</gold> par téléportation)."
  extension_notify_teleport: "<green>La cité <aqua>{city}</aqua> a débloqué l'extension <white>{extension}</white> : <white>/city tp {city}</white> vous y téléporte pour <gold>{cost}</gold>."
  extension_bought_promo_frenzy: "<green>Extension <white>{extension}</white> achetée pour la cité <aqua>{city}</aqua> (<gold>{price}</gold> du solde de la cité). <gray>Ses idiots marchands feront {n} promos de plus par jour."
  extension_notify_promo_frenzy: "<green>La cité <aqua>{city}</aqua> a débloqué la <light_purple>Promotion en folie</light_purple> : ses idiots marchands font {n} promos de plus par jour !"
  extension_scanning: "<gray>Vérification des idiots marchands présents dans la cité…"
  extension_scan_running: "<yellow>Une vérification est déjà en cours pour cette cité."
  extension_scan_failed: "<red>Impossible de vérifier les idiots de la cité <aqua>{city}</aqua> pour le moment, réessayez."
  extension_skins_ok: "<green>Les {n} skins d'idiots marchands sont présents dans la cité <aqua>{city}</aqua> !"
  extension_skins_check: "<yellow>{present}/{n} skins présents dans la cité <aqua>{city}</aqua>. Skins manquants : <white>{missing}</white>."
  extension_skins_missing: "<red>Achat impossible : il manque des idiots marchands dans la cité <aqua>{city}</aqua>. Skins manquants : <white>{missing}</white>."

  extension_bought_beacon: "<green>Extension <white>{extension}</white> achetée pour la cité <aqua>{city}</aqua> (<gold>{price}</gold> du solde de la cité). <gray>Les effets de ses beacons s'appliquent désormais dans toute la cité."
  extension_notify_beacon: "<green>La cité <aqua>{city}</aqua> a débloqué l'extension <white>Beacon</white> : les effets de ses beacons s'appliquent dans toute la cité !"
  extension_scanning_beacons: "<gray>Vérification des beacons de la cité…"
  extension_beacon_cooldown: "<yellow>Patientez encore {seconds} s avant une nouvelle vérification des beacons."
  extension_beacons_ok: "<green>{found} beacons valides dans la cité <aqua>{city}</aqua> ({required} requis) : condition remplie !<gray>{reasons}"
  extension_beacons_check: "<yellow>{found}/{required} beacons valides dans la cité <aqua>{city}</aqua>.<gray>{reasons}"
  extension_beacons_missing: "<red>Achat impossible : <white>{found}/{required}</white> beacons valides dans la cité <aqua>{city}</aqua>.<gray>{reasons}"
  # Raisons d'invalidité d'un beacon.
  beacon_invalid_prefix: "Invalides :"
  beacon_invalid_outside: "hors territoire"
  beacon_invalid_incomplete_pyramid: "pyramide incomplète"
  beacon_invalid_unlit: "éteint (faisceau obstrué)"
  beacon_invalid_no_effect: "aucun effet choisi"

  # Noms des skins (types de villageois) dans les messages ci-dessus.
  villager_type_desert: "désert"
  villager_type_jungle: "jungle"
  villager_type_plains: "plaine"
  villager_type_savanna: "savane"
  villager_type_snow: "neige"
  villager_type_swamp: "marais"
  villager_type_taiga: "taïga"

  # --- Promotion en folie : annonces aux membres en ligne ----------------
  # {city}, {percent}, {delay}. Envoyées sans le préfixe [Cité].
  frenzy_warning: "<light_purple>✦ <bold>Promotion en folie</bold> ✦</light_purple> <white>Dans <yellow>{delay}</yellow>, les idiots marchands de <aqua>{city}</aqua> passent en promo <gold><bold>-{percent}%</bold></gold> !"
  frenzy_start: "<light_purple>✦ <bold>Promotion en folie</bold> ✦</light_purple> <white>C'est parti : <gold><bold>-{percent}%</bold></gold> chez les idiots marchands de <aqua>{city}</aqua> pendant <yellow>{delay}</yellow> !"
  frenzy_reminder: "<light_purple>✦ <bold>Promotion en folie</bold> ✦</light_purple> <white>Promo <gold><bold>-{percent}%</bold></gold> en cours chez les idiots marchands de <aqua>{city}</aqua>, encore <yellow>{delay}</yellow>."

  # --- téléportation (extension) --------------------------------------
  tp_usage: "<red>Usage : /city tp <cité>"
  tp_locked: "<red>La cité <aqua>{city}</aqua> n'a pas l'extension Téléportation (<gold>{price}</gold>, à acheter par le propriétaire dans <white>/cityboard {city}</white>, onglet Extensions)."
  tp_in_progress: "<yellow>Téléportation déjà en cours…"
  tp_unavailable: "<red>Le centre de la cité <aqua>{city}</aqua> n'est pas accessible pour le moment : rien n'a été débité."
  tp_no_space: "<red>Aucun espace libre au-dessus du centre de la cité <aqua>{city}</aqua> : rien n'a été débité."
  tp_done: "<green>Bienvenue à <aqua>{city}</aqua> ! <gray>(<gold>{cost}</gold> débitées)"
  tp_failed: "<red>La téléportation a échoué : <gold>{cost}</gold> vous ont été rendues."

  # --- dissolution ---------------------------------------------------
  disband_confirm: "<yellow>Dissoudre la cité <aqua>{city}</aqua> ? Son solde (<gold>{balance}</gold>) sera remboursé au prorata des contributions. Tapez <white>/city disband confirm</white> dans les {seconds} s."
  disbanded: "<yellow>La cité <aqua>{city}</aqua> a été dissoute."
  refund_notify: "<green>Dissolution de la cité <aqua>{city}</aqua> : <gold>{amount}</gold> vous ont été remboursées."
  disbanded_notify: "<yellow>La cité <aqua>{city}</aqua> a été dissoute par son propriétaire."
  admin_deleted_notify: "<yellow>La cité <aqua>{city}</aqua> a été supprimée par l'administration."

  # --- notifications au propriétaire -----------------------------------
  left_notify: "<yellow><white>{player}</white> a quitté la cité <aqua>{city}</aqua>."
  contribution_notify: "<green><white>{player}</white> a versé <gold>{amount}</gold> à la cité <aqua>{city}</aqua> (solde : <gold>{balance}</gold>)."

  # --- notifications reçues hors ligne -------------------------------
  offline_header: "<gold>Pendant votre absence ({count}) :"

  # --- info ----------------------------------------------------------
  info: |-
    <gold>Cité <aqua>{city}</aqua></gold>
    <gray>Propriétaire : <white>{owner}</white>
    <gray>Palier : <white>{tier}</white> (<white>{size}x{size}</white>), centre <white>{x} {z}</white> dans <white>{world}</white>
    <gray>Membres : <white>{members}</white> · Solde : <gold>{balance}</gold>

  # --- bordures et tableau de bord ------------------------------------
  border_usage: "<red>Usage : /border <cité> on|off"
  cityboard_usage: "<red>Usage : /cityboard <cité>"
  border_on: "<green>Bordures de <aqua>{city}</aqua> affichées."
  border_area: "<gray>Territoire {size}x{size} : X de <white>{minx}</white> à <white>{maxx}</white>, Z de <white>{minz}</white> à <white>{maxz}</white>."
  border_off: "<yellow>Bordures masquées."
  border_other_world: "<red>La cité <aqua>{city}</aqua> est dans un autre monde."

  # --- classement (à droite de l'écran) --------------------------------
  ranking_usage: "<red>Usage : /classement on|off"
  ranking_on: "<green>Classement des cités affiché. <gray>(/classement off pour le masquer)"
  ranking_off: "<yellow>Classement des cités masqué."
  ranking_title: "<gradient:#FFE259:#FFA751><bold>✦ Classement des cités ✦</bold></gradient>"
  # 1er or, 2e argent, 3e bronze
  ranking_line_1: "<#FFD700>★ 1. <bold>{city}</bold>"
  ranking_line_2: "<#C0C0C0>★ 2. <bold>{city}</bold>"
  ranking_line_3: "<#CD7F32>★ 3. <bold>{city}</bold>"
  ranking_line: "<gray>{rank}. <white>{city}"
  ranking_stats: "<green>P{tier} <dark_gray>· <light_purple>✦ {extensions}"
  ranking_empty: "<gray><italic>Aucune cité pour l'instant"

  # --- administration ------------------------------------------------
  admin_usage: "<red>Usage : /cityadmin delete <cité> | settier <cité> <palier> | rename <cité> <nom> | info <cité> | promos <cité> | promo <cité> <pourcentage>"
  admin_promos: "<gray>Promotion en folie, <aqua>{city}</aqua> : <white>{plans}"
  admin_promo_forced: "<green>Promo de cité -{percent} % forcée pour <aqua>{city}</aqua> sur la rotation en cours."
  admin_no_frenzy: "<red>La cité <aqua>{city}</aqua> n'a pas l'extension Promotion en folie."
  admin_deleted: "<yellow>Cité <aqua>{city}</aqua> supprimée (solde remboursé)."
  admin_tier: "<green>Cité <aqua>{city}</aqua> passée au palier {tier}."
  admin_renamed: "<green>Cité renommée en <aqua>{city}</aqua>."
