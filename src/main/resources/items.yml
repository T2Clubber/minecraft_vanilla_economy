# ===================================================================
# Pool d'items du marché - Idiots du village (market nitwits)
# ===================================================================
#
# RÈGLES GLOBALES À IMPLÉMENTER DANS MarketManager :
#
# 1. NO OVERLAP : un item présent dans la rotation VENTE (joueur -> idiot,
#    idiot achète) ne doit JAMAIS être présent simultanément dans la
#    rotation ACHAT (idiot -> joueur, idiot vend), et inversement.
#    => lors du tirage toutes les 2h, exclure de la liste ACHAT les items
#       déjà tirés dans la liste VENTE pour ce cycle, et vice-versa.
#
# 2. SELL >= BUY : à tout instant, price_sell(item) >= price_buy(item).
#    Même si un item apparaît dans les deux rotations à des cycles
#    différents, la contrainte doit être vérifiée après CHAQUE recalcul
#    de prix (toutes les 2h), pas seulement à l'initialisation.
#    Implémentation suggérée : price_sell = max(price_buy * markup,
#    price_buy + price_floor_per_unit) pour garantir l'inégalité même
#    sur les items à prix très faible.
#
# 3. PRICE FLOOR : prix plancher global = 1 pièce pour 64 unités d'un
#    item (price_floor_per_unit = 1/64 ≈ 0.015625). Ce plancher est
#    TOUJOURS exprimé par unité, indépendamment du base_number de
#    l'item (voir point 4) : price_unitaire_min = 1/64.
#
# 4. BASE_NUMBER : chaque item a son propre "lot de référence". base_price
#    est le prix de base_number unités de cet item (pas forcément 64).
#    Exemple : DIRT { base_price: 1, base_number: 64 } => 64 terre pour
#    1 pièce. DIAMOND { base_price: 250, base_number: 1 } => 1 pièce par
#    diamant individuel. Calcul du prix unitaire : 
#       prix_unitaire = base_price / base_number
#    Les transactions se font en pièces entières, jamais arrondies en
#    faveur du joueur :
#     - VENTE (le joueur vend à l'idiot) : paiement = arrondi INFÉRIEUR de
#       prix_unitaire * N, et seuls les objets payés sont pris (48 cannes
#       à 1 pièce les 32 => 32 vendues pour 1 pièce, 16 gardées) ;
#     - ACHAT (l'idiot vend au joueur) : prix = arrondi SUPÉRIEUR de
#       prix_unitaire * N (minimum 1 pièce) ; un clic achète ce que vaut
#       1 pièce, un shift-clic s'arrête sur des pièces entières.
#    base_number ne dépasse jamais la stack size vanilla de l'item 
#    (ex: ENDER_PEARL max 16, MUSIC_DISC_* et NAME_TAG max 1).
#    La baisse du prix de rachat suit une échelle de base_number x
#    scale_lots unités (config.yml) : un petit base_number fait baisser
#    le prix plus vite quand les joueurs vendent beaucoup.
#
# ===================================================================

global:
  price_floor_per_unit: 0.015625   # = 1 pièce / 64 unités, plancher absolu
  sell_must_be_gte_buy: true
  no_overlap_buy_sell: true
  rotation_interval_hours: 2
  favor_in_stock_items_for_buy_rotation: true

# Répartition des 9 slots par catégorie, appliquée identiquement aux
# deux interfaces (ACHAT et VENTE)
slots_per_category:
  minerals: 1
  food_nature: 3
  hostile_mob: 1
  blocks: 3
  other: 1

